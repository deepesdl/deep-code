# Run ruff lint + format checks before every commit.
#
# One-time setup per clone:
#   pip install pre-commit
#   pre-commit install
#
# Run manually across the whole repo:
#   pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in sync with the ruff version used locally and in CI.
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
